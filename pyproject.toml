[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvc-intelligence"
version = "0.2.0"
description = "Point-in-time PVC research, preserving the original experiments"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "pyxlsb", "catboost", "requests", "joblib", "matplotlib", "openpyxl", "statsmodels", "beautifulsoup4"]

[tool.setuptools.packages.find]
where = ["src"]
